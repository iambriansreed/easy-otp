name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

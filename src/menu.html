<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Easy OTP</title>
        <style>
            /*
         * Mirrors the metrics of a macOS menu-bar menu. The window itself
         * supplies the blurred material and rounded corners, so everything here
         * paints on transparency.
         *
         * The --row-* variables are the point of the exercise: a native menu is
         * locked to a 22px row, these are free to change.
         */
            :root {
                color-scheme: light dark;

                --row-height: 25px; /* native menus sit at 22px */
                --row-gap: 8px;
                --menu-pad-v: 4px;
                --item-inset: 5px;
                --item-pad-h: 9px;

                --icon-size: 18px;
                --icon-gap: 8px;

                /* Separators align with the icon column rather than the panel edge,
               which is what the system menus do */
                --separator-inset: 14px;

                --font-size: 14px;
                --radius: 5px;

                --accent: #0a6cff;
                --text: rgba(0, 0, 0, 0.92);
                --text-dim: rgba(0, 0, 0, 0.38);
                --separator: rgba(0, 0, 0, 0.11);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --text: rgba(255, 255, 255, 0.92);
                    --text-dim: rgba(255, 255, 255, 0.36);
                    --separator: rgba(255, 255, 255, 0.14);
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
                font-size: var(--font-size);
                color: var(--text);
                cursor: default;
                -webkit-user-select: none;
                user-select: none;
            }

            #menu {
                max-height: 100%;
                overflow-y: auto;
                padding: var(--menu-pad-v) 0;
                /* Given real DOM focus (for aria-activedescendant to work with
               VoiceOver) but a native menu has no visible focus rectangle around
               the whole panel — the .active row's highlight is what stands in
               for it. */
                outline: none;
            }
            #menu::-webkit-scrollbar {
                width: 0;
            }

            .row {
                position: relative;
                display: flex;
                align-items: center;
                gap: var(--icon-gap);
                height: var(--row-height);
                margin: var(--row-gap) var(--item-inset) 0;
                padding: 0 var(--item-pad-h);
                border-radius: var(--radius);
                white-space: nowrap;
            }
            .row:first-child {
                margin-top: 0;
            }

            .row.active {
                background: var(--accent);
                color: #fff;
            }
            .row.disabled {
                color: var(--text-dim);
            }

            /* The reason this menu is not a native one: inverted and faded until you point at it. */
            .icon {
                flex: 0 0 var(--icon-size);
                width: var(--icon-size);
                height: var(--icon-size);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: calc(var(--icon-size) - 2px);
                line-height: 1;
                filter: grayscale(1) invert(1);
                opacity: 0.6;
            }
            .icon img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 3px;
                background: #fff;
                border: 1px solid #fff;
            }
            .row.active .icon {
                filter: none;
                opacity: 1;
            }

            .label {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .trailing {
                flex: 0 0 auto;
                color: var(--text-dim);
                font-variant-numeric: tabular-nums;
            }
            .row.active .trailing {
                color: rgba(255, 255, 255, 0.75);
            }

            /*
         * Copy confirmation. It replaces the menu outright rather than dressing
         * up the row it came from, so there is nothing left to read but the code.
         * Same blue as a highlighted menu row, at a size meant to be read at a
         * glance from across the desk.
         */
            .confirm {
                /* Equal side columns are what actually centres the middle one; the
               min-width guarantees there is slack for them to balance against */
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 16px;
                min-width: 300px;
                margin: 0 var(--item-inset);
                padding: 14px 20px;
                border-radius: var(--radius);
                background: var(--accent);
                color: #fff;
                font-size: 18px;
                font-weight: 600;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }
            .confirm .issuer {
                justify-self: start;
            }
            .confirm .code {
                justify-self: end;
                letter-spacing: 0.04em;
            }

            /* "Copied" has said its piece by the time the code has been read */
            .confirm .word {
                justify-self: center;
                animation: fade-copied 900ms ease-out 900ms forwards;
            }
            @keyframes fade-copied {
                to {
                    opacity: 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .confirm .word {
                    animation: none;
                }
            }

            .separator {
                height: 1px;
                margin: 5px var(--separator-inset);
                background: var(--separator);
            }

            /* Section headers sit tighter and smaller than items, as they do natively */
            .header {
                padding: 4px var(--item-inset) 2px;
                margin: 0 var(--item-inset);
                font-size: 12px;
                font-weight: 600;
                color: var(--text-dim);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <div id="menu" role="menu" aria-label="Easy OTP" tabindex="-1"></div>
        <script type="module" src="./menu.mjs"></script>
    </body>
</html>

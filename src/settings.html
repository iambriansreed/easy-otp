<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy OTP Settings</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --border: #d1d1d6;
            --text: #1c1c1e;
            --text-secondary: #6c6c70;
            --accent: #007aff;
            --danger: #ff3b30;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --surface: #2c2c2e;
                --border: #3a3a3c;
                --text: #f2f2f7;
                --text-secondary: #8e8e93;
                --accent: #0a84ff;
                --danger: #ff453a;
                --input-bg: #3a3a3c;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        section { display: flex; flex-direction: column; gap: 10px; }

        h2 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* Account list */
        .account-list { display: flex; flex-direction: column; gap: 2px; }

        .empty-msg {
            color: var(--text-secondary);
            text-align: center;
            padding: 16px 0;
        }

        .account-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: opacity 0.15s;
        }

        .account-row.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
        .account-row.dragging { opacity: 0.35; }

        .account-view {
            display: flex;
            align-items: center;
            padding: 9px 10px;
            gap: 8px;
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-secondary);
            font-size: 15px;
            user-select: none;
            flex-shrink: 0;
            line-height: 1;
        }
        .drag-handle:active { cursor: grabbing; }

        .account-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .btn-icon {
            padding: 3px 8px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            line-height: 1.4;
        }
        .btn-icon.edit { color: var(--accent); }
        .btn-icon.delete { color: var(--danger); font-size: 14px; }
        .btn-icon:hover { background: var(--bg); }

        .account-edit {
            border-top: 1px solid var(--border);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .account-edit.hidden { display: none; }
        .account-view.hidden { display: none; }

        .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }

        /* Mode tabs */
        .mode-tabs {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 7px;
            overflow: hidden;
            width: fit-content;
        }

        .tab {
            padding: 5px 14px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .tab.active { background: var(--accent); color: white; }
        .tab:not(:last-child) { border-right: 1px solid var(--border); }

        .panel { display: flex; flex-direction: column; gap: 6px; }
        .panel.hidden { display: none; }

        /* Footer */
        .footer-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: auto;
        }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
        input[type="text"]::placeholder { color: var(--text-secondary); }

        /* Buttons */
        .btn-primary {
            padding: 7px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            align-self: flex-start;
        }
        .btn-primary:hover { filter: brightness(1.1); }

        .btn-secondary {
            padding: 7px 16px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        .btn-secondary:hover { background: var(--bg); }

        .btn-save {
            padding: 5px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-cancel-sm {
            padding: 5px 12px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .error {
            color: var(--danger);
            font-size: 12px;
            min-height: 16px;
        }

        .import-result {
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 16px;
        }

        .import-drop {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .import-drop:hover, .import-drop.drag-active {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <section>
            <h2>Accounts</h2>
            <div id="account-list" class="account-list"></div>
            <p id="empty-msg" class="empty-msg" style="display:none">No accounts added yet.</p>
        </section>

        <section>
            <h2>Add Account</h2>
            <div class="mode-tabs">
                <button class="tab active" data-mode="url">From URL</button>
                <button class="tab" data-mode="manual">Manual</button>
                <button class="tab" data-mode="import">Import File</button>
            </div>
            <div id="url-panel" class="panel">
                <input type="text" id="otp-url" placeholder="otpauth://totp/Issuer:Account?secret=...">
                <p class="error" id="url-error"></p>
            </div>
            <div id="manual-panel" class="panel hidden">
                <input type="text" id="m-issuer" placeholder="Issuer">
                <input type="text" id="m-account" placeholder="Account">
                <input type="text" id="m-secret" placeholder="Secret">
                <p class="error" id="manual-error"></p>
            </div>
            <div id="import-panel" class="panel hidden">
                <div class="import-drop" id="import-drop">
                    Click or drop a .txt file — one otpauth:// URL per line
                </div>
                <input type="file" id="import-file" accept=".txt" style="display:none">
                <p class="import-result" id="import-result"></p>
            </div>
            <button id="add-btn" class="btn-primary">Add Account</button>
        </section>

        <section class="footer-section">
            <button id="notif-btn" class="btn-secondary">Notification Settings...</button>
        </section>
    </div>

    <script>
        let accounts = [];
        let dragSrcIndex = null;

        function esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseOtpUrl(raw) {
            try {
                const u = new URL(raw.trim());
                if (u.protocol !== 'otpauth:') return null;
                if (u.host !== 'totp') return null;

                const secret = u.searchParams.get('secret');
                if (!secret) return null;

                const label = decodeURIComponent(u.pathname.replace(/^\//, ''));
                const colon = label.indexOf(':');
                let issuer, account;
                if (colon !== -1) {
                    issuer = label.slice(0, colon).trim();
                    account = label.slice(colon + 1).trim();
                } else {
                    issuer = '';
                    account = label.trim();
                }

                const issuerParam = u.searchParams.get('issuer');
                if (issuerParam) issuer = issuerParam;

                return { account, secret, issuer };
            } catch {
                return null;
            }
        }

        async function persist() {
            await window.api.saveAccounts(accounts);
        }

        function renderAccounts() {
            const list = document.getElementById('account-list');
            const emptyMsg = document.getElementById('empty-msg');
            list.innerHTML = '';
            emptyMsg.style.display = accounts.length ? 'none' : 'block';

            accounts.forEach((acct, index) => {
                const row = document.createElement('div');
                row.className = 'account-row';
                row.draggable = true;
                row.dataset.index = String(index);

                const label = acct.issuer ? `${esc(acct.issuer)}: ${esc(acct.account)}` : esc(acct.account);

                row.innerHTML = `
                    <div class="account-view">
                        <span class="drag-handle" title="Drag to reorder">⠿</span>
                        <span class="account-label">${label}</span>
                        <div class="row-actions">
                            <button class="btn-icon edit">Edit</button>
                            <button class="btn-icon delete">×</button>
                        </div>
                    </div>
                    <div class="account-edit hidden">
                        <input class="edit-issuer" type="text" placeholder="Issuer" value="${esc(acct.issuer)}">
                        <input class="edit-account" type="text" placeholder="Account" value="${esc(acct.account)}">
                        <input class="edit-secret" type="text" placeholder="Secret" value="${esc(acct.secret)}">
                        <div class="edit-actions">
                            <button class="btn-cancel-sm">Cancel</button>
                            <button class="btn-save">Save</button>
                        </div>
                    </div>
                `;

                const view = row.querySelector('.account-view');
                const editPanel = row.querySelector('.account-edit');

                row.querySelector('.btn-icon.edit').addEventListener('click', () => {
                    view.classList.add('hidden');
                    editPanel.classList.remove('hidden');
                    editPanel.querySelector('.edit-issuer').focus();
                });

                row.querySelector('.btn-cancel-sm').addEventListener('click', () => {
                    view.classList.remove('hidden');
                    editPanel.classList.add('hidden');
                });

                row.querySelector('.btn-save').addEventListener('click', async () => {
                    const issuer = editPanel.querySelector('.edit-issuer').value.trim();
                    const account = editPanel.querySelector('.edit-account').value.trim();
                    const secret = editPanel.querySelector('.edit-secret').value.trim();
                    if (!account || !secret) return;
                    accounts[index] = { account, secret, issuer };
                    await persist();
                    renderAccounts();
                });

                row.querySelector('.btn-icon.delete').addEventListener('click', async () => {
                    accounts.splice(index, 1);
                    await persist();
                    renderAccounts();
                });

                row.addEventListener('dragstart', (e) => {
                    dragSrcIndex = index;
                    row.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                    if (dragSrcIndex !== index) row.classList.add('drag-over');
                });

                row.addEventListener('dragleave', () => row.classList.remove('drag-over'));

                row.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    row.classList.remove('drag-over');
                    if (dragSrcIndex === null || dragSrcIndex === index) return;
                    const [moved] = accounts.splice(dragSrcIndex, 1);
                    accounts.splice(index, 0, moved);
                    dragSrcIndex = null;
                    await persist();
                    renderAccounts();
                });

                list.appendChild(row);
            });
        }

        // Mode tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const mode = tab.dataset.mode;
                document.getElementById('url-panel').classList.toggle('hidden', mode !== 'url');
                document.getElementById('manual-panel').classList.toggle('hidden', mode !== 'manual');
                document.getElementById('import-panel').classList.toggle('hidden', mode !== 'import');
                document.getElementById('add-btn').style.display = mode === 'import' ? 'none' : '';
                document.getElementById('import-result').textContent = '';
            });
        });

        // Bulk import
        const importDrop = document.getElementById('import-drop');
        const importFile = document.getElementById('import-file');

        importDrop.addEventListener('click', () => importFile.click());

        importDrop.addEventListener('dragover', (e) => { e.preventDefault(); importDrop.classList.add('drag-active'); });
        importDrop.addEventListener('dragleave', () => importDrop.classList.remove('drag-active'));
        importDrop.addEventListener('drop', (e) => {
            e.preventDefault();
            importDrop.classList.remove('drag-active');
            const file = e.dataTransfer.files[0];
            if (file) processImportFile(file);
        });

        importFile.addEventListener('change', () => {
            if (importFile.files[0]) processImportFile(importFile.files[0]);
            importFile.value = '';
        });

        async function processImportFile(file) {
            const text = await file.text();
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            let added = 0, updated = 0, skipped = 0;

            for (const line of lines) {
                const parsed = parseOtpUrl(line);
                if (!parsed) { skipped++; continue; }
                const idx = accounts.findIndex(a => a.account === parsed.account && a.issuer === parsed.issuer);
                if (idx !== -1) { accounts[idx] = parsed; updated++; }
                else { accounts.push(parsed); added++; }
            }

            await persist();
            renderAccounts();

            const parts = [];
            if (added) parts.push(`${added} added`);
            if (updated) parts.push(`${updated} updated`);
            if (skipped) parts.push(`${skipped} skipped`);
            document.getElementById('import-result').textContent = parts.join(', ') || 'No valid URLs found.';
        }

        // Add account
        document.getElementById('add-btn').addEventListener('click', async () => {
            const mode = document.querySelector('.tab.active').dataset.mode;

            if (mode === 'url') {
                const input = document.getElementById('otp-url');
                const errEl = document.getElementById('url-error');
                const parsed = parseOtpUrl(input.value);
                if (!parsed) {
                    errEl.textContent = 'Invalid otpauth:// URL.';
                    return;
                }
                errEl.textContent = '';
                const idx = accounts.findIndex(a => a.account === parsed.account && a.issuer === parsed.issuer);
                if (idx !== -1) accounts[idx] = parsed;
                else accounts.push(parsed);
                input.value = '';
                await persist();
                renderAccounts();
            } else {
                const issuer = document.getElementById('m-issuer').value.trim();
                const account = document.getElementById('m-account').value.trim();
                const secret = document.getElementById('m-secret').value.trim();
                const errEl = document.getElementById('manual-error');
                if (!account || !secret) {
                    errEl.textContent = 'Account and Secret are required.';
                    return;
                }
                errEl.textContent = '';
                const idx = accounts.findIndex(a => a.account === account && a.issuer === issuer);
                if (idx !== -1) accounts[idx] = { account, secret, issuer };
                else accounts.push({ account, secret, issuer });
                document.getElementById('m-issuer').value = '';
                document.getElementById('m-account').value = '';
                document.getElementById('m-secret').value = '';
                await persist();
                renderAccounts();
            }
        });

        // Enter key submits add form
        ['otp-url', 'm-issuer', 'm-account', 'm-secret'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('add-btn').click();
            });
        });

        // Notification settings
        document.getElementById('notif-btn').addEventListener('click', () => {
            window.api.openNotificationSettings();
        });

        async function init() {
            accounts = await window.api.getAccounts();
            renderAccounts();
        }

        init();
    </script>
</body>
</html>

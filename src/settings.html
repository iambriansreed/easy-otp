<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Easy OTP Settings</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f5f5f7;
                --surface: #ffffff;
                --border: #d1d1d6;
                --text: #1c1c1e;
                --text-secondary: #6c6c70;
                --accent: #007aff;
                --danger: #ff3b30;
                --success: #34c759;
                --input-bg: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1c1c1e;
                    --surface: #2c2c2e;
                    --border: #3a3a3c;
                    --text: #f2f2f7;
                    --text-secondary: #8e8e93;
                    --accent: #0a84ff;
                    --danger: #ff453a;
                    --success: #30d158;
                    --input-bg: #3a3a3c;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                font-size: 13px;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .container {
                flex: 1;
                overflow-y: auto;
                padding: 20px 16px;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            section {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            h2 {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--text-secondary);
            }

            /* Account list */
            .account-list {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .empty-msg {
                color: var(--text-secondary);
                text-align: center;
                padding: 16px 0;
            }

            .account-row {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                transition: opacity 0.15s;
            }

            .account-row.drag-over {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
            }
            .account-row.dragging {
                opacity: 0.35;
            }
            .account-row.is-hidden .account-view .icon-slot,
            .account-row.is-hidden .account-view .account-label {
                opacity: 0.55;
            }

            .hidden-badge {
                color: var(--text-secondary);
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }

            .account-view {
                display: flex;
                align-items: center;
                padding: 9px 10px;
                gap: 8px;
            }

            .drag-handle {
                cursor: grab;
                color: var(--text-secondary);
                font-size: 15px;
                user-select: none;
                flex-shrink: 0;
                line-height: 1;
            }
            .drag-handle:active {
                cursor: grabbing;
            }

            .account-label {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* Icons */
            .icon-slot {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                line-height: 1;
                user-select: none;
            }
            .icon-slot img {
                width: 18px;
                height: 18px;
                border-radius: 4px;
                object-fit: contain;
            }
            .icon-slot .icon-blank {
                width: 18px;
                height: 18px;
                border-radius: 4px;
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text-secondary);
                font-size: 10px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Same as the tray menu: inverted and faded until you point at the row. The
               letter placeholder is left alone, since the menu never shows one. The
               edit and create forms' preview is always in the hovered state, so it shows
               the icon as the menu will when the account is pointed at. Scoped to hidden
               accounts only: a visible account never renders greyed-out in the tray menu,
               so it should never look grey in Settings either. */
            .account-row.is-hidden .account-view .icon-slot:not(:has(.icon-blank)) {
                filter: grayscale(1) invert(1);
            }
            .account-view .icon-slot img,
            .icon-preview img {
                background: #fff;
                border: 1px solid #fff;
            }
            .account-row:hover .account-view .icon-slot {
                filter: none;
                opacity: 1;
            }
            /* A hidden account's icon keeps the dimming its label has */
            .account-row.is-hidden:hover .account-view .icon-slot {
                filter: none;
                opacity: 0.55;
            }

            /* Wraps an icon editor's .icon-row + .icon-status outside the account-edit
           flex column (e.g. in the manual add form), matching that column's gap. */
            .icon-editor {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .icon-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            /* Find Missing Icons: status text and button cluster at the right edge —
           when the button is hidden on success, the text alone stays right-aligned. */
            .bulk-icons-row {
                justify-content: flex-end;
            }

            .icon-row .emoji-input {
                width: 44px;
                flex-shrink: 0;
                text-align: center;
                font-size: 16px;
                padding: 6px 4px;
                cursor: pointer;
                caret-color: transparent;
            }

            .icon-status {
                color: var(--text-secondary);
                font-size: 12px;
            }
            .icon-status.success {
                color: var(--success);
            }

            .icon-mode {
                flex-shrink: 0;
                padding: 4px 6px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--input-bg);
                color: var(--text);
                font-size: 12px;
                font-family: inherit;
            }

            .favicon-controls,
            .emoji-controls {
                display: flex;
                align-items: center;
                gap: 6px;
                flex: 1;
                min-width: 0;
            }
            .favicon-controls.hidden,
            .emoji-controls.hidden {
                display: none;
            }

            .url-group {
                display: flex;
                align-items: stretch;
                flex: 1;
                min-width: 0;
            }
            .url-group .url-prefix {
                display: flex;
                align-items: center;
                padding: 0 4px 0 8px;
                border: 1px solid var(--border);
                border-right: none;
                border-radius: 6px 0 0 6px;
                background: var(--bg);
                color: var(--text-secondary);
                font-size: 12px;
                white-space: nowrap;
                user-select: none;
            }
            .url-group .edit-url {
                flex: 1;
                min-width: 0;
                border-radius: 0 6px 6px 0;
            }

            .btn-icon.find-icon {
                width: 26px;
                height: 26px;
                padding: 0;
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
            }

            .btn-icon.clear-icon {
                width: 26px;
                height: 26px;
                padding: 0;
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .spinner {
                width: 12px;
                height: 12px;
                border: 2px solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                opacity: 0.7;
                animation: spin 0.6s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            button[disabled] {
                opacity: 0.5;
                cursor: default;
            }

            .row-actions {
                display: flex;
                align-items: center;
                gap: 4px;
                flex-shrink: 0;
            }

            .btn-icon {
                padding: 3px 8px;
                border-radius: 5px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text);
                cursor: pointer;
                font-size: 12px;
                font-family: inherit;
                line-height: 1.4;
            }
            .btn-icon.edit {
                color: var(--accent);
            }
            .btn-icon.delete {
                color: var(--danger);
                font-size: 14px;
            }
            .btn-icon:hover {
                background: var(--bg);
            }
            .btn-icon svg {
                display: block;
            }

            .btn-icon.toggle-hidden {
                width: 26px;
                height: 26px;
                padding: 0;
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .account-edit {
                border-top: 1px solid var(--border);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .account-edit.hidden {
                display: none;
            }
            .account-view.hidden {
                display: none;
            }

            .edit-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                justify-content: space-between;
            }
            .edit-actions .action-buttons {
                display: flex;
                gap: 6px;
            }

            /* Mode tabs */
            .mode-tabs {
                display: flex;
                border: 1px solid var(--border);
                border-radius: 7px;
                overflow: hidden;
                width: fit-content;
            }

            .tab {
                padding: 5px 14px;
                border: none;
                background: transparent;
                color: var(--text);
                cursor: pointer;
                font-size: 12px;
                font-family: inherit;
            }
            .tab.active {
                background: var(--accent);
                color: white;
            }
            .tab:not(:last-child) {
                border-right: 1px solid var(--border);
            }

            .panel {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .panel.hidden {
                display: none;
            }

            /* Whichever tab's error is non-empty sits left of the Add Account button;
           flex-end clusters both at the row's right edge when nothing is empty. */
            .form-footer {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
            }

            /* Inputs */
            input[type='text'] {
                width: 100%;
                padding: 6px 10px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--input-bg);
                color: var(--text);
                font-size: 13px;
                font-family: inherit;
                outline: none;
            }
            input[type='text']:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
            }
            input[type='text']::placeholder {
                color: var(--text-secondary);
            }

            /* Buttons */
            .btn-primary {
                padding: 7px 16px;
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 7px;
                font-size: 13px;
                font-family: inherit;
                cursor: pointer;
            }
            .btn-primary:hover {
                filter: brightness(1.1);
            }

            .btn-secondary {
                padding: 7px 16px;
                background: transparent;
                color: var(--accent);
                border: 1px solid var(--accent);
                border-radius: 7px;
                font-size: 13px;
                font-family: inherit;
                cursor: pointer;
            }
            .btn-secondary:hover {
                background: var(--bg);
            }

            .btn-save {
                padding: 5px 12px;
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 12px;
                font-family: inherit;
                cursor: pointer;
            }

            .btn-cancel-sm {
                padding: 5px 12px;
                background: transparent;
                color: var(--text-secondary);
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 12px;
                font-family: inherit;
                cursor: pointer;
            }

            .error {
                color: var(--danger);
                font-size: 12px;
                min-height: 16px;
            }

            .import-result {
                font-size: 12px;
                color: var(--text-secondary);
                min-height: 16px;
            }

            /* These reserve height so a message appearing doesn't shift layout, but
           that reserved height reads as a stray gap above the Add Account button
           while empty — collapse them entirely until there's something to show. */
            .error:empty,
            .import-result:empty,
            .icon-status:empty {
                display: none;
            }

            .import-drop {
                border: 2px dashed var(--border);
                border-radius: 8px;
                padding: 20px;
                text-align: center;
                color: var(--text-secondary);
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    color 0.15s;
            }
            .import-drop:hover,
            .import-drop.drag-active {
                border-color: var(--accent);
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <section>
                <h2>Accounts</h2>
                <div id="account-list" class="account-list"></div>
                <p id="empty-msg" class="empty-msg" style="display: none">No accounts added yet.</p>
                <div class="icon-row bulk-icons-row" id="bulk-icons-row">
                    <span class="icon-status" id="bulk-icons-status"></span>
                    <button id="bulk-icons-btn" class="btn-secondary" style="display: none">
                        Find Missing Icons
                    </button>
                </div>
            </section>

            <section>
                <h2>Add Account</h2>
                <div class="mode-tabs">
                    <button class="tab active" data-mode="url">From URL</button>
                    <button class="tab" data-mode="manual">Manual</button>
                    <button class="tab" data-mode="import">Import File</button>
                </div>
                <div id="url-panel" class="panel">
                    <input type="text" id="otp-url" placeholder="otpauth://totp/Issuer:Account?secret=..." />
                </div>
                <div id="manual-panel" class="panel hidden">
                    <input type="text" id="m-issuer" placeholder="Issuer" />
                    <input type="text" id="m-account" placeholder="Account" />
                    <input type="text" id="m-secret" placeholder="Secret" />
                    <div id="m-icon-editor" class="icon-editor"></div>
                </div>
                <div id="import-panel" class="panel hidden">
                    <div class="import-drop" id="import-drop">
                        Click or drop a .txt file — one otpauth:// URL per line
                    </div>
                    <input type="file" id="import-file" accept=".txt" style="display: none" />
                    <p class="import-result" id="import-result"></p>
                </div>
                <div class="form-footer">
                    <p class="error" id="url-error"></p>
                    <p class="error" id="manual-error"></p>
                    <button id="add-btn" class="btn-primary">Add Account</button>
                </div>
            </section>
        </div>
        <script type="module" src="./settings.mjs"></script>
    </body>
</html>
